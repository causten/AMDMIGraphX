name: Build MIGraphX Packages (RPM & DEB)

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

  workflow_call:
    inputs:
      rocm_release:
        type: string
        description: ROCm release version (e.g., 7.2.2)
        required: false
        default: "7.2.2"
      migraphx_repo:
        type: string
        description: MIGraphX repository (defaults to current repo)
        required: false
        default: ""
      migraphx_branch:
        type: string
        description: MIGraphX branch/ref to build (defaults to current ref)
        required: false
        default: ""
      gpu_targets:
        type: string
        description: Semicolon-separated GPU architecture targets
        required: false
        default: "gfx906;gfx908;gfx90a;gfx1030;gfx1100;gfx1101;gfx1201"

  workflow_dispatch:
    inputs:
      rocm_release:
        type: string
        description: ROCm release version (e.g., 7.2.2)
        required: true
        default: "7.2.2"
      migraphx_repo:
        type: string
        description: MIGraphX repository (defaults to current repo)
        default: ""
      migraphx_branch:
        type: string
        description: MIGraphX branch/ref to build (defaults to current ref)
        default: ""
      gpu_targets:
        type: string
        description: Semicolon-separated GPU architecture targets
        default: "gfx906;gfx908;gfx90a;gfx1030;gfx1100;gfx1101;gfx1201"

env:
  ROCM_VERSION: ${{ inputs.rocm_release || '7.2.2' }}
  # Used by the RPM/manylinux build to enumerate CPython tags shipped in the image.
  PYTHON_VERSIONS: "cp310-cp310 cp311-cp311 cp312-cp312 cp313-cp313 cp314-cp314"
  PRIMARY_PYTHON_VERSION: cp312-cp312

jobs:
  build:
    name: Build MIGraphX (${{ matrix.os_tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg_format: RPM
            os_tag: rhel8
            container: quay.io/pypa/manylinux_2_28_x86_64
          - pkg_format: DEB
            os_tag: ubuntu-24.04
            container: ubuntu:24.04
          - pkg_format: DEB
            os_tag: ubuntu-22.04
            container: ubuntu:22.04
    container:
      image: ${{ matrix.container }}

    steps:
      # -------- RPM (manylinux_2_28 / RHEL 8) setup --------

      - name: Install base system dependencies (RPM)
        if: matrix.pkg_format == 'RPM'
        run: |
          dnf install -y epel-release
          dnf install -y \
            git \
            wget \
            which \
            pkg-config \
            rpm-build \
            gcc-c++ \
            libstdc++-devel \
            clang-tools-extra \
            cppcheck \
            numactl-devel \
            sqlite-devel \
            openssl-devel \
            bzip2-devel \
            libffi-devel \
            zlib-devel \
            protobuf-devel \
            protobuf-compiler \
            doxygen

      - name: Add ROCm repository (RPM)
        if: matrix.pkg_format == 'RPM'
        run: |
          # Follows the official ROCm RHEL native install instructions:
          # https://rocm.docs.amd.com/projects/install-on-linux/en/latest/install/install-methods/package-manager/package-manager-rhel.html
          tee /etc/yum.repos.d/rocm.repo <<REPOEOF
          [rocm]
          name=ROCm ${{ env.ROCM_VERSION }} repository
          baseurl=https://repo.radeon.com/rocm/el8/${{ env.ROCM_VERSION }}/main
          enabled=1
          priority=50
          gpgcheck=1
          gpgkey=https://repo.radeon.com/rocm/rocm.gpg.key
          REPOEOF

          dnf clean all

      - name: Install ROCm development packages (RPM)
        if: matrix.pkg_format == 'RPM'
        run: |
          dnf install -y \
            rocm-hip-sdk \
            rocm-cmake \
            miopen-hip-devel \
            rocblas-devel \
            hipblaslt-devel \
            half \
            composablekernel-devel

      - name: Install Python dev packages (RPM, 3.10 - 3.14)
        if: matrix.pkg_format == 'RPM'
        run: |
          for pyver in ${{ env.PYTHON_VERSIONS }}; do
            pypath="/opt/python/$pyver"
            if [ -d "$pypath" ]; then
              echo "Found: $("$pypath/bin/python" --version) at $pypath"
              "$pypath/bin/pip" install --upgrade pip setuptools wheel
              "$pypath/bin/pip" install pybind11[global] numpy
            else
              echo "::warning::Python $pyver not found in manylinux image"
            fi
          done

          PRIMARY="/opt/python/${{ env.PRIMARY_PYTHON_VERSION }}"
          echo "PATH=${PRIMARY}/bin:${PATH}" >> "$GITHUB_ENV"
          echo "PYTHON3_EXECUTABLE=${PRIMARY}/bin/python" >> "$GITHUB_ENV"
          echo "Using primary Python: $("$PRIMARY/bin/python" --version)"

      # -------- DEB (Ubuntu 24.04 noble) setup --------
      # Follows the official ROCm Ubuntu native install instructions:
      # https://rocm.docs.amd.com/projects/install-on-linux/en/latest/install/install-methods/package-manager/package-manager-ubuntu.html

      - name: Install base system dependencies (DEB)
        if: matrix.pkg_format == 'DEB'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            wget \
            gnupg \
            lsb-release \
            sudo \
            build-essential \
            clang-format \
            clang-tidy \
            cppcheck \
            git \
            pkg-config \
            libnuma-dev \
            libsqlite3-dev \
            libssl-dev \
            libbz2-dev \
            libffi-dev \
            zlib1g-dev \
            libprotobuf-dev \
            protobuf-compiler \
            doxygen \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv \
            python3-setuptools \
            python3-wheel

      - name: Register ROCm package signing key (DEB)
        if: matrix.pkg_format == 'DEB'
        run: |
          mkdir --parents --mode=0755 /etc/apt/keyrings
          wget https://repo.radeon.com/rocm/rocm.gpg.key -O - | \
            gpg --dearmor | tee /etc/apt/keyrings/rocm.gpg > /dev/null

      - name: Register ROCm apt repository (DEB)
        if: matrix.pkg_format == 'DEB'
        run: |
          UBUNTU_CODENAME=$(. /etc/os-release && echo "$UBUNTU_CODENAME")

          tee /etc/apt/sources.list.d/rocm.list <<EOF
          deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/${{ env.ROCM_VERSION }} ${UBUNTU_CODENAME} main
          EOF

          tee /etc/apt/preferences.d/rocm-pin-600 <<EOF
          Package: *
          Pin: release o=repo.radeon.com
          Pin-Priority: 600
          EOF

          apt-get update

      - name: Install ROCm development packages (DEB)
        if: matrix.pkg_format == 'DEB'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get install -y --no-install-recommends \
            rocm-hip-sdk \
            rocm-cmake \
            miopen-hip-dev \
            rocblas-dev \
            hipblaslt-dev \
            composablekernel-dev \
            half

      - name: Install Python dev packages (DEB, default OS python through 3.14)
        if: matrix.pkg_format == 'DEB'
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # The system default python3 is already installed by the base deps step.
          # Use the deadsnakes PPA to install any newer minor versions up to 3.14
          # so MIGraphX can build Python bindings for every supported interpreter.
          apt-get install -y --no-install-recommends software-properties-common
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update

          default_minor=$(python3 -c 'import sys; print(sys.version_info.minor)')
          echo "System default Python: 3.${default_minor}"

          installed=()
          for minor in $(seq "${default_minor}" 14); do
            pkgs="python3.${minor} python3.${minor}-dev python3.${minor}-venv"
            if apt-get install -y --no-install-recommends ${pkgs}; then
              installed+=("3.${minor}")
            else
              echo "::warning::python3.${minor} dev packages unavailable for this Ubuntu release"
            fi
          done

          echo "Installed Python dev packages for: ${installed[*]}"

      - name: Install Python build helpers (DEB)
        if: matrix.pkg_format == 'DEB'
        run: |
          # Use an isolated venv so we don't fight PEP 668 / dpkg-installed pip
          # (Ubuntu's system pip lacks a RECORD file and can't be upgraded in place).
          python3 -m venv --system-site-packages /opt/migraphx-venv
          /opt/migraphx-venv/bin/pip install --upgrade pip setuptools wheel
          /opt/migraphx-venv/bin/pip install pybind11[global] numpy

          echo "/opt/migraphx-venv/bin" >> "$GITHUB_PATH"
          echo "PYTHON3_EXECUTABLE=/opt/migraphx-venv/bin/python" >> "$GITHUB_ENV"
          echo "Using primary Python: $(/opt/migraphx-venv/bin/python --version)"

      # -------- Common steps --------

      - name: Install cmake 3.28.4 and rbuild
        run: |
          python3 -m pip install \
            cmake==3.28.4 \
            https://github.com/RadeonOpenCompute/rbuild/archive/master.tar.gz \
            cget
          echo "Using cmake: $(cmake --version | head -n1)"

      - name: Checkout MIGraphX
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.migraphx_repo || github.repository }}
          ref: ${{ inputs.migraphx_branch || github.ref }}
          path: AMDMIGraphX

      - name: Prepare MIGraphX dependencies via rbuild
        working-directory: AMDMIGraphX
        run: rbuild prepare -d /migraphx-deps

      - name: Configure MIGraphX
        working-directory: AMDMIGraphX
        run: |
          export CXX=/opt/rocm/llvm/bin/clang++
          export CC=/opt/rocm/llvm/bin/clang

          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/rocm \
            -DCMAKE_PREFIX_PATH="/migraphx-deps;/opt/rocm" \
            -DCMAKE_EXECUTE_PROCESS_COMMAND_ECHO=STDOUT \
            -DGPU_TARGETS="${{ inputs.gpu_targets || 'gfx906;gfx908;gfx90a;gfx1030;gfx1100;gfx1101;gfx1201' }}" \
            -DMIGRAPHX_ENABLE_PYTHON=ON \
            -DMIGRAPHX_DISABLE_VIRTUAL_ENV=ON \
            -DMIGRAPHX_USE_COMPOSABLEKERNEL=ON \
            -DPython_EXECUTABLE="${PYTHON3_EXECUTABLE}" \
            -DPython3_EXECUTABLE="${PYTHON3_EXECUTABLE}"

      - name: Build MIGraphX
        working-directory: AMDMIGraphX/build
        run: |
          make -j"$(nproc)" generate
          make -j"$(nproc)" all

      - name: Generate ${{ matrix.pkg_format }} package
        working-directory: AMDMIGraphX/build
        run: cpack -G ${{ matrix.pkg_format }} --verbose

      - name: Upload ${{ matrix.os_tag }} packages
        uses: actions/upload-artifact@v4
        with:
          name: migraphx-${{ matrix.os_tag }}-packages
          path: |
            AMDMIGraphX/build/*.rpm
            AMDMIGraphX/build/*.deb
          if-no-files-found: error
